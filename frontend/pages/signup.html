<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — IP-SAKTI Sahayak</title>
<meta name="description" content="Create an IP-SAKTI Sahayak account to access the AI Assistant and save your chat history.">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>

<header class="site-header">
  <nav class="navbar container" aria-label="Primary">
    <a href="../index.html" class="brand">
      <span class="brand-mark" aria-hidden="true">IP</span>
      <span class="brand-text">
        <span class="brand-primary">IP-SAKTI</span>
        <span class="brand-secondary">Sahayak</span>
      </span>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="../index.html">Home</a></li>
      <li><a href="chat.html">AI Assistant</a></li>
      <li><a href="abs.html">ABS Helper</a></li>
      <li><a href="tkdl.html">TKDL</a></li>
      <li><a href="sources.html">Sources</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="nav-tools" id="navTools"></div>
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
</header>

<main id="main">
  <div class="auth-page">
    <div class="auth-card">
      <span class="badge">🌿 Get started</span>
      <h1 style="margin:14px 0 24px; font-size:1.6rem;">Create your account</h1>

      <div class="auth-error" id="authError"></div>

      <form class="panel" id="signupForm">
        <div class="field">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" class="input" placeholder="Your name" required autocomplete="name">
        </div>

        <div class="field">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" class="input" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="field">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" class="input" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
          <p class="hint">Use at least 6 characters.</p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="signupSubmit">Sign Up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</main>

<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
  'use strict';

  document.addEventListener('DOMContentLoaded', function () {

    if (window.IPSaktiAuth && window.IPSaktiAuth.isLoggedIn()) {
      window.location.href = 'chat.html';
      return;
    }

    var form = document.getElementById('signupForm');
    var submitBtn = document.getElementById('signupSubmit');
    var errorBox = document.getElementById('authError');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    function hideError() {
      errorBox.classList.remove('visible');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      hideError();

      var name = document.getElementById('signupName').value.trim();
      var email = document.getElementById('signupEmail').value.trim();
      var password = document.getElementById('signupPassword').value;

      if (password.length < 6) {
        showError('Password must be at least 6 characters long.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      window.IPSaktiAuth.signup(name, email, password)
        .then(function () {
          window.location.href = 'chat.html';
        })
        .catch(function (error) {
          showError(error.message || 'Unable to create account. Please try again.');
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign Up';
        });
    });
  });
})();
</script>
</body>
</html>
