<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — IP-SAKTI Sahayak</title>
<meta name="description" content="Log in to IP-SAKTI Sahayak to access the AI Assistant and your chat history.">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>

<header class="site-header">
  <nav class="navbar container" aria-label="Primary">
    <a href="../index.html" class="brand">
      <span class="brand-mark" aria-hidden="true">IP</span>
      <span class="brand-text">
        <span class="brand-primary">IP-SAKTI</span>
        <span class="brand-secondary">Sahayak</span>
      </span>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="../index.html">Home</a></li>
      <li><a href="chat.html">AI Assistant</a></li>
      <li><a href="abs.html">ABS Helper</a></li>
      <li><a href="tkdl.html">TKDL</a></li>
      <li><a href="sources.html">Sources</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="nav-tools" id="navTools"></div>
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
</header>

<main id="main">
  <div class="auth-page">
    <div class="auth-card">
      <span class="badge">🌿 Welcome back</span>
      <h1 style="margin:14px 0 24px; font-size:1.6rem;">Log in to your account</h1>

      <div class="auth-error" id="authError"></div>

      <form class="panel" id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="input" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="input" placeholder="Your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">Log In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>
</main>

<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
  'use strict';

  document.addEventListener('DOMContentLoaded', function () {

    if (window.IPSaktiAuth && window.IPSaktiAuth.isLoggedIn()) {
      window.location.href = 'chat.html';
      return;
    }

    var form = document.getElementById('loginForm');
    var submitBtn = document.getElementById('loginSubmit');
    var errorBox = document.getElementById('authError');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    function hideError() {
      errorBox.classList.remove('visible');
    }

    function getNextUrl() {
      var params = new URLSearchParams(window.location.search);
      var next = params.get('next');
      return next || 'chat.html';
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      hideError();

      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      window.IPSaktiAuth.login(email, password)
        .then(function () {
          window.location.href = getNextUrl();
        })
        .catch(function (error) {
          showError(error.message || 'Unable to log in. Please try again.');
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
        });
    });
  });
})();
</script>
</body>
</html>
